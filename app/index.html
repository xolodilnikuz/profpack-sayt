<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- sarlavha va tavsif tilga qarab src/i18n/texts/meta.js dan almashtiriladi; bu yerda — o‘zbekcha (asosiy) -->
<title>Karobka va gofrokarton ishlab chiqarish — Profpack, Toshkent</title>
<meta name="description" content="Profpack zavodi, Toshkent: gofra karton karobkalar (qutilar) istalgan o‘lchamda, logotip bosish, gofrokarton va rulon qog‘oz. Tel: +998 93 746 59 59.">
<meta name="theme-color" content="#0E1233">
<meta property="og:title" content="Profpack — to‘liq siklli qadoq zavodi">
<meta property="og:description" content="Makulaturani qayta ishlaymiz, rulon qog‘oz va gofrokarton ishlab chiqaramiz, quti yasab, logotipingizni bosamiz.">
<!-- build paytida to‘liq manzilga aylantiriladi (SITE_URL — src/data/site.js): havola ulashilganda rasm shundan olinadi -->
<meta property="og:image" content="assets/profpack-logo.png">
<!-- sayt belgisi: fayllar public/ da. Alohida fayl bo‘lgani uchun Google qidiruv natijasida ham shu belgi chiqadi -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Saira:wdth,wght@50..100,500..800&family=Tektur:wdth,wght@75..100,500..800&display=swap">
<script>
  // Til: manzil (/ru/, /en/) → ?lang= (eski havolalar) → saqlangan tanlov → brauzer tili (faqat ruscha) → o‘zbekcha.
  // Inglizcha faqat tanlansa yoki /en/ ochilsa — mahalliy mijozlar uchun asosiy til o‘zbekcha.
  // React yuklanishidan oldin ishlaydi: <html lang> darhol to‘g‘ri bo‘ladi (ruscha sarlavha shrifti miltillamaydi).
  // Xuddi shu tartib src/i18n/lang.js da ham bor.
  try {
    var html = document.documentElement;
    var m = location.pathname.match(/^(.*\/)(ru|en)\/?(?:index\.html)?$/);
    var l = m ? m[2] : (new URLSearchParams(location.search).get('lang') || localStorage.getItem('pp-lang'));
    if (l !== 'ru' && l !== 'uz' && l !== 'en') l = /^ru\b/i.test(navigator.language || '') ? 'ru' : 'uz';
    // data-page — shu sahifaga yozilgan tayyor HTML tili (build qo‘yadi). Kerakli til boshqa bo‘lsa — pp-swap
    var page = html.getAttribute('data-page');
    if (page && page !== l) html.className += ' pp-swap';
    html.lang = l;
  } catch (e) {}
</script>
<style>
  /* Build qilingan har sahifada (/, /ru/, /en/) #root ichida o‘z tilidagi tayyor HTML bo‘ladi (vite.config.js → prerender).
     Kerakli til boshqa bo‘lsa (pp-swap), React sahifani o‘sha tilda chizguncha uni ko‘rsatmaymiz — til "sakrab" almashmasin. */
  html.pp-swap #root[data-prerendered]{visibility:hidden}
</style>
<!-- JavaScript o‘chirilgan bo‘lsa: bosh sarlavha animatsiyasiz, darhol ko‘rinadi.
     #root — asosiy CSS bu yerdan keyin ulanadi, shuning uchun qoida undan "kuchliroq" bo‘lishi kerak -->
<noscript><style>#root .hero__title .line{opacity:1;font-stretch:75%;transform:none}</style></noscript>
</head>
<body>
<div id="root"></div>
<script>
  // Faqat build qilingan sahifada (tayyor HTML bor bo‘lsa) ishlaydi; `npm run dev` da hammasini React o‘zi qiladi.
  (function () {
    var html = document.documentElement, root = document.getElementById('root');
    if (!root.hasAttribute('data-prerendered')) return;
    var loaded = function () { requestAnimationFrame(function () { html.classList.add('is-loaded'); }); };
    if (!html.classList.contains('pp-swap')) {
      // tayyor matn darhol ko‘rinadi: bosh sarlavha animatsiyasi shriftlar yuklangach boshlanadi (ko‘pi bilan 1,2 s)
      if (document.fonts && window.Promise) Promise.race([document.fonts.ready, new Promise(function (r) { setTimeout(r, 1200); })]).then(loaded);
      else loaded();
    } else {
      // kerakli til boshqa — tayyor HTML yashirin turadi. JavaScript 4 soniyada yuklanmasa (sekin internet) — sahifaning o‘z tilidagisini ko‘rsatamiz
      setTimeout(function () {
        if (!html.classList.contains('pp-swap')) return;
        html.classList.remove('pp-swap');
        html.lang = html.getAttribute('data-page');
        loaded();
      }, 4000);
    }
  })();
</script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
